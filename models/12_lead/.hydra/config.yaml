model:
  _target_: __main__.ECGandPriorLVEFtoLabel
  config:
    classification: None
    ecg_repr_dim: 256
    dropout_prob: 0.3
    label: ${dataset.config.label}
    lvef: ${dataset.config.lvef}
    ecg: ${dataset.config.ecg}
  objective:
    _target_: None
trainer:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${utils.output_dir}
  min_epochs: 1
  max_epochs: 40
  deterministic: true
  devices:
  - 0
  - 1
  - 2
dataset:
  _target_: __main__.SupervisedDataset
  config:
    datadir: /storage2/payal/dropbox/private/SILVER/data
    hospital: mgh
    label: future_1_365_any_below_40
    ecg:
      storedir: /storage2/shared/ecg
      channels:
      - I
      - II
      - III
      - aVR
      - aVL
      - aVF
      - V1
      - V2
      - V3
      - V4
      - V5
      - V6
      wavelet: false
    lvef:
      prior:
      - days_since_diagnosis
      - initial_lvef
      - preceding_lvef
      - prior_lvef_support
      - prior_lvef_mean
      - prior_lvef_min
      - prior_lvef_max
      - prior_lvef_std
      - prior_lvef_range
      - prior_lvef_any_hfref
      - prior_lvef_all_hfref
      - prior_lvef_any_hfpef
      - prior_lvef_all_hfpef
      - prior_lvef_any_hfmref
      - prior_lvef_all_hfmref
  split: None
utils:
  seed: 140799
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
wandb:
  _target_: lightning.pytorch.loggers.WandbLogger
  project: SILVER
  entity: payalchandak
  name: ${dataset.config.label}
  resume: allow
  log_model: true
optimizer:
  batch_size: 2048
  num_dataloader_workers: 0
  init_lr: 1.0e-05
  betas:
  - 0.9
  - 0.99
  weight_decay: 0.05
  end_lr_frac_of_init_lr: 0.001
  lr_frac_warmup_steps: 0.01
  lr_decay_power: 1.0
  num_warmup_steps: ???
  num_training_steps: ???
  end_lr: ???
callbacks:
- _target_: lightning.pytorch.callbacks.ModelCheckpoint
  monitor: ???
  mode: ???
  dirpath: ${utils.output_dir}/checkpoints
  filename: epoch_{epoch:03d}
  auto_insert_metric_name: false
  save_last: True,
- _target_: lightning.pytorch.callbacks.LearningRateMonitor
  logging_interval: step
- _target_: lightning.pytorch.callbacks.early_stopping.EarlyStopping
  monitor: ???
  mode: ???
  patience: 20
